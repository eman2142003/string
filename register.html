<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f6f8ff">
   <div class="container mt-4 pt-3 " style="background-color: #f6f8ff;">
    <div class="row">
        <div class="col-md-6">
            <img src="img/56f58c5bbae6320e1aa5d36445fd722b.jpg" class="w-75" alt="صورة">
        </div>

        <div class="col-md-6 d-flex flex-column justify-content-center">
            <h3>Welcome</h3>
            <h6 class="text-muted mb-2">Go ahead and sign up, let everyone<br>know how awsome you are!</h6>
            <h6 id="result"></h6>
            <form onsubmit="return validatedData()" action="success.html" method="post">
                <input type="text" name="user" id="user" class="form-control p-3 mb-4" placeholder="User Name">
                <input type="text" name="email" id="email" class="form-control p-3 mb-4" placeholder="Email">
                <input type="password" name="password" id="password" class="form-control p-3 mb-4" placeholder="Password">
                <input type="password" name="confirm_Password" id="confirm_password" class="form-control p-3 mb-4" placeholder="Confirm Password">
                <input type="Submit" name="submit" class="btn btn-primary mb-3 w-100 " value="Create New Account">

            </form>
            
        </div>
    </div>
</div>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/main.js"></script>
</body>
</html>
